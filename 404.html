<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#0b1023;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

.container{

    padding:20px;
}

h1{
    font-size:80px;
    color:#FFD700;
    margin-bottom:10px;
}

}

p{

    color:#000;
    text-decoration:none;
    border-radius:8px;

    background:#ffcc00;

<div class="container">

<h1>404</h1>

Sorry, the page you are looking for doesn't exist or has been moved.

</html>
